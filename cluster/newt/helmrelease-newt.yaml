apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: newt
  namespace: newt
spec:
  interval: 15m
  chart:
    spec:
      chart: newt
      # Was "*", which floats to whatever the repo publishes — pinned so a
      # chart release cannot change the tunnel without a commit.
      version: "1.5.0"
      sourceRef:
        kind: HelmRepository
        name: fossorial
        namespace: flux-system
  values:
    newtInstances:
      - name: main-tunnel
        enabled: true
        auth:
          existingSecretName: newt-credentials
          # Keys match the default: PANGOLIN_ENDPOINT, NEWT_ID, NEWT_SECRET
        upstream:
          # Cilium creates this LoadBalancer Service for the Gateway named
          # "main" in the gateway namespace. Pangolin terminates TLS at the
          # edge, so the tunnel targets the Gateway's plain HTTP listener.
          url: "http://cilium-gateway-main.gateway.svc.cluster.local"
