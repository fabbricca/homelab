# Pangolin blueprint: public resources declared in git instead of clicked into
# the dashboard. newt applies it to its own site every time it connects
# (BLUEPRINT_FILE in helmrelease-newt.yaml).
#
# Additive by construction: Pangolin matches each entry by its key (the
# resource's niceId) and creates or updates only that resource. Resources not
# listed here — jellyfin, immich, keycloak, … made in the dashboard — are never
# touched; in Pangolin 1.16.2 the only code path that deletes proxy resources
# is deleting the whole org (verified in server/lib/blueprints/proxyResources.ts).
# Edits made in the dashboard to the resources below WILL be overwritten on the
# next connect: this file is their source of truth.
#
# Same shape as the dashboard-made immich resource: TLS at the edge, no
# Pangolin SSO (the apps authenticate themselves), plain HTTP to the Gateway.
apiVersion: v1
kind: ConfigMap
metadata:
  name: newt-blueprint
  namespace: newt
data:
  blueprint.yaml: |
    public-resources:
      awaken:
        name: awaken
        protocol: http
        full-domain: awaken.iberu.me
        ssl: true
        targets:
          - hostname: cilium-gateway-main.gateway.svc.cluster.local
            method: http
            port: 80
      loom:
        name: loom
        protocol: http
        full-domain: loom.iberu.me
        ssl: true
        targets:
          - hostname: cilium-gateway-main.gateway.svc.cluster.local
            method: http
            port: 80
      # Project Igris: the lobby API over HTTPS like the apps above …
      igris:
        name: igris
        protocol: http
        full-domain: igris.iberu.me
        ssl: true
        targets:
          - hostname: cilium-gateway-main.gateway.svc.cluster.local
            method: http
            port: 80
      # … and the match servers as raw UDP resources. Raw resources have no hostname: they
      # listen on the VPS's public IP at proxy-port, so play.iberu.me is a plain DNS record
      # for the VPS. They need, on the VPS (not in this repo): `flags.allow_raw_resources:
      # true` in Pangolin's config.yml, `27015-27018:27015-27018/udp` on gerbil in
      # docker-compose.yml, traefik entryPoints `udp-27015` … `udp-27018` (address
      # ":2701x/udp"), and the ports open in the Oracle security list and host firewall.
      # Targets must not set `method` (1.16.2 schema: server/lib/blueprints/types.ts). One
      # resource per port: the lobby hands each room its own port and public == internal.
      igris-udp-27015:
        name: igris match 27015
        protocol: udp
        proxy-port: 27015
        targets:
          - hostname: igris-match.igris.svc.cluster.local
            port: 27015
      igris-udp-27016:
        name: igris match 27016
        protocol: udp
        proxy-port: 27016
        targets:
          - hostname: igris-match.igris.svc.cluster.local
            port: 27016
      igris-udp-27017:
        name: igris match 27017
        protocol: udp
        proxy-port: 27017
        targets:
          - hostname: igris-match.igris.svc.cluster.local
            port: 27017
      igris-udp-27018:
        name: igris match 27018
        protocol: udp
        proxy-port: 27018
        targets:
          - hostname: igris-match.igris.svc.cluster.local
            port: 27018
