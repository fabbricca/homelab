apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  # Block storage on the SSD (/volume1) over iSCSI. Databases and object
  # storage want real random IOPS, which NFS on the HDD does not give.
  # NOTE: storageClassName is immutable — changing it needs the PVC
  # deleted and recreated (see README section 8).
  storageClassName: synology-csi-ssd
  resources:
    requests:
      storage: 50Gi
