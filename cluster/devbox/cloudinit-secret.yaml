# cloud-init for the devbox guest. First boot only.
#
# ---------------------------------------------------------------------------
# THIS SECRET IS DELIBERATELY NOT SOPS-ENCRYPTED, AND THAT IS ONLY SAFE
# BECAUSE IT CONTAINS NOTHING SECRET.
#
# It is a Secret at all because KubeVirt gives inline cloudInitNoCloud a
# 2048-byte ceiling and refuses anything larger:
#
#   spec.template.spec.volumes[1].cloudInitNoCloud userdata exceeds 2048 byte
#   limit. Should use UserDataSecretRef for larger data.
#
# The only credential below is an SSH *public* key. Everything else is package
# names and download URLs, and it is worth far more readable in Git than
# encrypted — this is the file that defines what the machine actually is.
# The devbox Kustomization has no `decryption:` block, so Flux applies it
# verbatim.
#
# If anything genuinely secret is ever added here — a Tailscale auth key, a
# token, a password — this file must move under SOPS at that moment:
#
#   sops --encrypt --in-place cluster/devbox/cloudinit-secret.yaml
#
# and cluster/devbox needs a `decryption:` block added to its Flux
# Kustomization in bootstrap/kustomizations/kustomization-devbox.yaml.
# ---------------------------------------------------------------------------
#
# Changing this file does NOT reconfigure a running guest. cloud-init runs
# once, on first boot, against a blank disk. To re-apply it, delete the
# DataVolume and let Flux rebuild the disk from the Debian image.
apiVersion: v1
kind: Secret
metadata:
  name: devbox-cloudinit
  namespace: devbox
  labels:
    app.kubernetes.io/name: devbox
    app.kubernetes.io/component: cloud-init
type: Opaque
stringData:
  userdata: |
    #cloud-config
    hostname: devbox
    fqdn: devbox
    preserve_hostname: false
    users:
      - name: iberu
        groups: [sudo]
        shell: /bin/bash
        sudo: ["ALL=(ALL) NOPASSWD:ALL"]
        # Every device that gets a shell here is listed below, on purpose.
        # Adding one by hand to ~/.ssh/authorized_keys on the guest works
        # until the next disk rebuild silently drops it — cloud-init only
        # runs against a blank disk, so this file is the only durable place.
        ssh_authorized_keys:
          # archlinux laptop
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIlrbRAs7ncG041O0h0X4YEvcwifUWU31q7Brs2/joMt fabb.riccardo@gmail.com
          # pixel-7a, via Termux over the tailnet
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK6JEyY2XL9mbgcJBcZlsaFosNE89hdd3R7zr3f+JSbT pixel-7a
    # No password login anywhere. The only way in is a key listed above,
    # over a Service that is not reachable from outside the tailnet.
    ssh_pwauth: false
    disable_root: true
    package_update: true
    packages:
      # qemu-guest-agent is not optional: without it KubeVirt cannot
      # read the guest's IP, and `virtctl stop` becomes a power cut
      # rather than a shutdown.
      - qemu-guest-agent
      - git
      - curl
      - ca-certificates
      - jq
      - ripgrep
      - tmux
      - vim
      - unzip
      - python3
      # Node's native addons need a toolchain to build.
      - build-essential
      # Deliberately NOT Debian's nodejs/npm. Trixie ships Node 20.19 and
      # Claude Code declares engines.node >= 22.0.0 — npm installs against a
      # too-old Node anyway, with nothing but an EBADENGINE *warning*, so it
      # breaks at runtime rather than at install time. Node is fetched by
      # version in runcmd instead. xz-utils is what unpacks that tarball.
      - xz-utils
    write_files:
      # Only root-owned files here. cloud-init runs write_files BEFORE the
      # users module, so anything with `owner: iberu` fails outright with
      #   Unknown user or group: getpwnam(): name not found: 'iberu'
      # and takes the whole module down with it. The user's own files are set
      # up in runcmd below, which runs late enough for the user to exist.
      - path: /etc/profile.d/npm-global.sh
        permissions: "0644"
        content: |
          export PATH="$HOME/.npm-global/bin:$PATH"
    runcmd:
      - [systemctl, enable, --now, qemu-guest-agent]
      # kubectl pinned to the cluster's own version. A client more
      # than one minor ahead of or behind the server is unsupported.
      - |
        curl -fsSL -o /usr/local/bin/kubectl https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl
        chmod 0755 /usr/local/bin/kubectl
      # talosctl pinned to the nodes' Talos version, for the same
      # reason: a newer client warns on every call.
      - |
        curl -fsSL -o /usr/local/bin/talosctl https://github.com/siderolabs/talos/releases/download/v1.13.8/talosctl-linux-amd64
        chmod 0755 /usr/local/bin/talosctl
      # Node 22 LTS, because Claude Code requires >= 22 and Debian 13 has 20.
      # The official tarball rather than a third-party apt repository: one
      # pinned version, one checksum, no extra trust anchor. Same shape as the
      # kubectl and talosctl downloads above, except this one is verified.
      - |
        set -e
        cd /tmp
        curl -fsSL -O https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz
        echo "d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307  node-v22.23.2-linux-x64.tar.xz" | sha256sum -c -
        tar -xJf node-v22.23.2-linux-x64.tar.xz -C /usr/local --strip-components=1 --exclude=CHANGELOG.md --exclude=LICENSE --exclude=README.md
        rm -f node-v22.23.2-linux-x64.tar.xz
      # Docker, for project_dembe. Not a convenience: that project's results
      # are only valid from inside its pinned ns-3 image, because libm's
      # exp/log10/pow differ in the last ULP between glibc versions and its
      # PLAN requires byte-identical runs for a given seed. Host builds are
      # for editing; every reported number comes out of the container.
      #
      # Debian's docker.io (26.1.5) rather than Docker's own apt repository:
      # one less trust anchor, and nothing here needs a newer engine.
      # The user needs to be in the docker group to use it without sudo.
      - |
        # docker.io AND docker-cli: in Debian 13 the two are split, and
        # docker.io alone ships only dockerd, docker-proxy and docker-init —
        # a working daemon with no `docker` command to drive it.
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends docker.io docker-cli
        systemctl enable --now docker
        usermod -aG docker iberu
      # npm's global prefix inside the user's home, so `npm -g` and every
      # later self-update work without sudo. Both directories are created
      # owned by iberu first: npm otherwise makes its cache as root and then
      # refuses to use it (EACCES on ~/.npm), which is how this failed the
      # first time.
      - |
        install -d -o iberu -g iberu /home/iberu/.npm-global /home/iberu/.npm
        sudo -u iberu -H npm config set prefix /home/iberu/.npm-global
        sudo -u iberu -H npm install -g @anthropic-ai/claude-code
      # A marker a human (or a script) can wait on, because
      # cloud-init finishing is not the same as ssh being useful.
      - [touch, /var/lib/cloud/devbox-ready]
    final_message: "devbox ready after $UPTIME seconds"
