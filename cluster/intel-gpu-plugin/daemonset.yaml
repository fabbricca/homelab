# Intel GPU device plugin, vendored from
#   intel/intel-device-plugins-for-kubernetes v0.36.0
#   deployments/gpu_plugin/base/intel-gpu-plugin.yaml
#
# Deployed as a plain DaemonSet rather than through the Helm chart: that chart
# creates a GpuDevicePlugin CR plus NodeFeatureRules, which drags in both the
# device-plugin operator and node-feature-discovery. On two identical nodes that
# is three components to discover what we already know — each EliteDesk has an
# i7-6700T with HD Graphics 530.
#
# Advertises gpu.intel.com/i915, which cluster/jellyfin/jellyfin.yaml requests.
# The plugin injects /dev/dri into requesting containers, so no manual device
# mount is needed. /dev/dri/renderD128 is mode 0666 on Talos, so Jellyfin's
# non-root UID 1000 can use it without extra supplementalGroups.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  namespace: kube-system
  labels:
    app: intel-gpu-plugin
spec:
  selector:
    matchLabels:
      app: intel-gpu-plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: intel-gpu-plugin
    spec:
      containers:
      - name: intel-gpu-plugin
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
        image: intel/intel-gpu-plugin:0.36.0
        imagePullPolicy: IfNotPresent
        securityContext:
          seLinuxOptions:
            type: "container_device_plugin_t"
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            memory: "45Mi"
            cpu: 40m
          limits:
            memory: "90Mi"
            cpu: 100m
        volumeMounts:
        - name: devfs
          mountPath: /dev/dri
          readOnly: true
        - name: sysfsdrm
          mountPath: /sys/class/drm
          readOnly: true
        - name: kubeletsockets
          mountPath: /var/lib/kubelet/device-plugins
        - name: cdipath
          mountPath: /var/run/cdi
      volumes:
      - name: devfs
        hostPath:
          path: /dev/dri
      - name: sysfsdrm
        hostPath:
          path: /sys/class/drm
      - name: kubeletsockets
        hostPath:
          path: /var/lib/kubelet/device-plugins
      - name: cdipath
        hostPath:
          path: /var/run/cdi
          type: DirectoryOrCreate
      nodeSelector:
        kubernetes.io/arch: amd64
