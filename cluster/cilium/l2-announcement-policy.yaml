# Replaces the former MetalLB L2Advertisement.
# Note: CiliumL2AnnouncementPolicy is still served as v2alpha1 in Cilium 1.20,
# unlike CiliumLoadBalancerIPPool which has graduated to v2.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default-l2-announcement
spec:
  loadBalancerIPs: true
  externalIPs: true
  # Matches eno1 on the EliteDesk minis; the broader pattern also covers
  # enp*/eth* in case a replacement NIC enumerates differently.
  interfaces:
    - ^e[nt][a-zA-Z0-9]+$
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
