# SOPS-encrypted; .sops.yaml encrypts stringData under cluster/.
#
# One secret, not the three-way split poseidon uses, because here the same
# credential genuinely is shared: the Postgres container's entrypoint falls
# back to DB_USERNAME / DB_PASSWORD / DB_DATABASE_NAME when POSTGRES_USER /
# POSTGRES_PASSWORD / POSTGRES_DB are unset (see set-env.sh in the immich
# postgres image), which is exactly how the upstream .env file drives both
# containers from one set of values. Duplicating them under two names would
# only create a way for them to drift apart.
#
# The password is deliberately alphanumeric: Immich documents that special
# characters break the connection string it assembles.
#
# Generated for this cluster. Nothing here is shared with anything else.
apiVersion: v1
kind: Secret
metadata:
    name: immich-database
    namespace: immich
type: Opaque
stringData:
