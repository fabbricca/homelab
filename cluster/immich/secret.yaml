# The restic repository password for the nightly library backup on the
# worker's SATA disk (backup-restic.yaml).
#
# Worth being clear about what this key is: restic encrypts the repository
# with it, and there is no recovery path. Lose both this file's plaintext and
# age.key and the backup on that disk is 400 GiB of noise. It is as important
# as the photographs, and it lives in exactly one place — this repository,
# encrypted to age.key, which is gitignored and on one laptop.
#
# Keep the same password when the offsite repository is added: restic copy
# between repositories is far simpler when they share it.
apiVersion: v1
kind: Secret
metadata:
    name: immich-restic
    namespace: immich
type: Opaque
stringData:
    RESTIC_PASSWORD: ENC[AES256_GCM,data:+o15o9LCAIxv7FylGLCtRvrm692lEIBQAS7Ix9xiNrO3LZpmsyvuosBswH7UU+uX,iv:VIennO4DAr8ab5B1vUTRjZ/0rO/UX5k4GbJF60fwSM8=,tag:wkydS8yVQ9yjaeWRppYn8g==,type:str]
