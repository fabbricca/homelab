# SOPS-encrypted; .sops.yaml encrypts stringData under cluster/.
#
# One secret, not the three-way split poseidon uses, because here the same
# credential genuinely is shared: the Postgres container's entrypoint falls
# back to DB_USERNAME / DB_PASSWORD / DB_DATABASE_NAME when POSTGRES_USER /
# POSTGRES_PASSWORD / POSTGRES_DB are unset (see set-env.sh in the immich
# postgres image), which is exactly how the upstream .env file drives both
# containers from one set of values. Duplicating them under two names would
# only create a way for them to drift apart.
#
# The password is deliberately alphanumeric: Immich documents that special
# characters break the connection string it assembles.
#
# Generated for this cluster. Nothing here is shared with anything else.
apiVersion: v1
kind: Secret
metadata:
    name: immich-database
    namespace: immich
type: Opaque
stringData:
    DB_USERNAME: ENC[AES256_GCM,data:et2E0JqL,iv:XJFGYX55owQ7VTOsNsht9gXRIVamdyUr9ObJDqUKKzQ=,tag:ywDIwcQkolV1nRL3YKLuhg==,type:str]
    DB_PASSWORD: ENC[AES256_GCM,data:fFVjAl8v3yfUnnpNeUCuAUswa4AVNmtqTnUi5Z0kMSapzowCWY+BwA==,iv:AAYJ9BpPZztEolwjwBZnEKcSscuOqaZvBds25ssUEh0=,tag:p1hmi+BWazJHlfEvb+mcBA==,type:str]
    DB_DATABASE_NAME: ENC[AES256_GCM,data:J0b2MeTx,iv:8CH9ZBB6CLrpjIEQawBGwOZbfTX2LTw6IAhZsX4lpB4=,tag:QrGRLUsKw6ws4QWVeZX88A==,type:str]
sops:
    age:
        - enc: |
            -----BEGIN AGE ENCRYPTED FILE-----
            YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0+IFgyNTUxOSBVc09RdjZEc0IyZXZMZDN0
            RXpSQWRac3RQNU5FeUdrdkN3K3JRaU5oRFRjCnZ4N0RhY0pML0MyMTR3VmYvdWZ4
            VzUzNzBNSGsxSncvc2VvdU5hKzJQbzAKLS0tIDZsTUtqSlJIZ3EzN0Yrdkk1UlM0
            eVV6WjBqQUVKUzJTNC9UT1lUd0hkYnMKXh3O4TQU5lF2yYC0rN7GYJD1fSVI9JMU
            hTAC5o1uSmXXN2qpyy1omCSIZ7U0rUWKqntwbHZIRiCAOtya0UF7mg==
            -----END AGE ENCRYPTED FILE-----
          recipient: age1n39wyrdgfj9ta5s7fwj786d4jjjhc90aw7f2ffqsmg794vme6swqtd9jca
    encrypted_regex: ^(data|stringData)$
    lastmodified: "2026-08-22T20:47:11Z"
    mac: ENC[AES256_GCM,data:wzcdQ4QDWdYnRHKcvdh2SUqy3DQZ7bJ8UcZXB5s8fUbNX5uAQAw5+Fh1ClQkkX+ZoEYpMLZyd2RAWfH7eBVjHftNtaWYB/XsfEtVW8ecKmJ90EUSs4cdfLzsgTjo2FBMyxqh6tlJa1Tc4oEQnYUHny+VslunxxknWZIlpOMkXbM=,iv:jvojRGdB3NB1aBge3mBniQ7+gAbAKIqUsbrPfTCR4Nk=,tag:aiEJBwAQeyPHHV3NfZtzmQ==,type:str]
