# The worker's 2.5" SATA disk, as a PersistentVolume.
#
# Provisioned and mounted by infra/files/backup-volume.yaml, which gives every
# node a `backup` user volume at /var/mnt/backup. This claims the worker's.
#
# A `local` volume rather than hostPath: the difference is nodeAffinity, which
# the scheduler enforces. A hostPath PV would happily bind on the control
# plane and silently write the backup to a different, empty disk.
#
# Reclaim policy is Retain for the obvious reason — this is the second copy of
# the photographs, and deleting the claim must not take it with them.
#
# --- Why this one is pinned to the worker ---
#
# The control plane has an identical disk sitting unused. Only one of them can
# hold the restic repository, because a repository split across two disks is
# two half-backups. The worker gets it because that is where Immich runs and
# has to run: see the nodeSelector in server.yaml.
#
# Moving the backup to the other node is therefore: change the hostname here,
# change the nodeSelector in server.yaml, and let restic build a fresh
# repository on the control plane's disk. The Talos side needs no change at
# all, which is the point of provisioning the volume on both nodes.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-backup
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/component: backup
spec:
  capacity:
    # Matches maxSize in the Talos user volume. XFS on a 465 GiB disk, capped
    # at 400 GiB so a second user volume can be added later without a
    # repartition.
    storage: 400Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  local:
    path: /var/mnt/backup
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-hs-worker-0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-backup
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  # Empty class plus volumeName binds this to the PV above and stops the
  # default class provisioning an iSCSI LUN instead — which would put the
  # backup back on the same SSD as the thing it is backing up.
  storageClassName: ""
  volumeName: immich-backup
  resources:
    requests:
      storage: 400Gi
