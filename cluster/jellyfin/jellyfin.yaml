apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  annotations:
    checkov.io/skip1: "CKV_K8S_8"
    checkov.io/skip2: "CKV_K8S_9"
    checkov.io/skip3: "CKV_K8S_25"
    checkov.io/skip4: "CKV_K8S_35"
    checkov.io/skip5: "CKV_K8S_40"
spec:
  replicas: 1
  # Recreate, not RollingUpdate: jellyfin-config is a ReadWriteOnce iSCSI
  # volume on synology-csi-ssd, so it can only ever be attached to one node.
  #
  # The previous strategy set maxSurge: 1 / maxUnavailable: 0, which
  # guarantees the replacement pod is scheduled *before* the old one is
  # terminated. When the scheduler put the new pod on a different node than
  # the incumbent, the rollout deadlocked:
  #
  #   Multi-Attach error for volume "pvc-2f35e423-...":
  #   Volume is already used by pod(s) jellyfin-5b86df46b7-r8hbr
  #
  # The old pod keeps serving and the new one sits in ContainerCreating
  # forever, because neither side can yield. Recreate tears the old pod down
  # first, which costs a few seconds of downtime on every rollout and is the
  # correct trade for a single-writer volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin@sha256:d20137292584fc6188532d80dd5a56cc4bd1c6055730f6b7552499ee22ab92c2
        imagePullPolicy: Always
        ports:
        - containerPort: 8096
        volumeMounts:
        # Config and cache on SSD-backed iSCSI: the library index is SQLite,
        # which does not belong on NFS.
        - name: config
          mountPath: /config
          subPath: config
        - name: config
          mountPath: /cache
          subPath: cache
        # Media on NFS at a fixed, browsable path (/volume2/HDD/media) rather
        # than inside a UUID-named directory that moves when the PVC is
        # recreated.
        - name: media
          mountPath: /media
        - name: tmp-volume
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
          runAsNonRoot: true
          runAsUser: 1000                          
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            memory: "768Mi"
            cpu:    "750m"
            # Device-plugin resources must be equal in requests and limits.
            gpu.intel.com/i915: "1"
          limits:
            memory: "2Gi"
            cpu:    "1"
            # QuickSync on the HD Graphics 530 in both i7-6700T nodes. The
            # Intel device plugin injects /dev/dri into the container, so no
            # device volumeMount is needed, and renderD128 is mode 0666 on
            # Talos so UID 1000 reaches it without extra supplementalGroups.
            #
            # Skylake QuickSync covers H.264 encode/decode and HEVC 8-bit
            # decode — no AV1, no HEVC 10-bit encode. Enable VAAPI in
            # Jellyfin's own playback settings; this only grants the device.
            gpu.intel.com/i915: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: jellyfin-config
      - name: media
        persistentVolumeClaim:
          claimName: jellyfin-media
      - name: tmp-volume
        emptyDir: {}
