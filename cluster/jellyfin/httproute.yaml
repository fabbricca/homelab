# Replaces jellyfin-ingress.yaml.
#
# The nginx session-affinity annotations are gone deliberately: Jellyfin runs a
# single replica (SQLite config is not safe for multiple writers), so there is
# nothing to pin sessions to. TLS protocol/cipher selection is now a Gateway
# listener concern rather than a per-route one.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  parentRefs:
    - name: main
      namespace: gateway
  hostnames:
    - jellyfin.iberu.me
  rules:
    - backendRefs:
        - name: jellyfin
          port: 80
      timeouts:
        # Media streams are long-lived; the 15s default would cut them off.
        request: 0s
