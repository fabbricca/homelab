apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-manager-helm-chart-value-overrides
  namespace: cert-manager
data:
  values.yaml: |-
    # Replaces the deprecated installCRDs flag, which the chart documents as
    # equivalent to crds.enabled=true plus crds.keep=true.
    #
    # keep=true matters: removing the CRDs would cascade-delete every
    # Certificate, Issuer and ClusterIssuer in the cluster along with them.
    crds:
      enabled: true
      keep: true
