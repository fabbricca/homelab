# Replace every CHANGE_ME below, then encrypt it in place BEFORE committing:
#
#   sops --encrypt --in-place cluster/wger/secret.yaml
#
# .sops.yaml encrypts data/stringData under cluster/. Flux only decrypts files
# that carry SOPS metadata — a plaintext Secret is applied exactly as written,
# so committing this file unencrypted publishes the keys to GitHub and deploys
# them in the same push.
#
# Split three ways so each workload receives only what it needs, as in
# poseidon: Django gets its signing keys and the database password, PowerSync
# gets its two connection strings, and nothing else in the namespace sees
# either.
#
# Every value here is generated for this cluster. In particular, do NOT reuse
# the SECRET_KEY or JWT keys from upstream's config/prod.env: they are public,
# and settings/main.py only *warns* about the JWT pair being the shipped
# default — anyone holding that private key can mint tokens for any user.
# ── Django ──────────────────────────────────────────────────────────────────
# SECRET_KEY: signs sessions, CSRF tokens and password-reset links. If it is
#   unset wger generates a random one per process, so every restart would log
#   everybody out. Generate with:
#     python3 -c "import secrets; print(secrets.token_urlsafe(50))"
#
# JWT_PRIVATE_KEY / JWT_PUBLIC_KEY: the RS256 pair that replaced the older
#   SIGNING_KEY setting. One key signs the mobile app's access and refresh
#   tokens (SimpleJWT and allauth.headless) *and* the short-lived tokens the
#   app presents to PowerSync, which fetches the public half from
#   /api/v2/powersync-keys to verify them. Without the pair the app cannot log
#   in at all. Generate with the image itself. The command never touches a
#   database, but settings/main.py refuses to load without DJANGO_DB_ENGINE,
#   hence the throwaway sqlite values:
#     docker run --rm \
#       -e DJANGO_DB_ENGINE=django.db.backends.sqlite3 -e DJANGO_DB_DATABASE=/tmp/x \
#       docker.io/wger/server@sha256:1c5789b93bfe5eed0b7287255782d9177027b255de2b22b59f511a693a48db04 \
#       python3 -W ignore manage.py generate-jwt-keys
#   and paste the two base64 lines below. Rotating them logs every app out.
