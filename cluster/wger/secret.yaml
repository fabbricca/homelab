# ── PowerSync ───────────────────────────────────────────────────────────────
# Connection strings, because that is the only form powersync.yaml takes them
# in (`uri: !env ...`). Same passwords as cluster/postgres/wger-db-secret.yaml,
# which is why those are alphanumeric.
#
# PS_DATABASE_URI is the replication *source*: the wger role, which owns the
#   `powersync` publication and has REPLICATION.
# PS_STORAGE_PG_URI is PowerSync's own bucket storage: the powersync_storage
#   role, confined to the `powersync` schema in the same database.
#
# Deliberately NOT given to the wger containers. settings/main.py prefers
# PS_DATABASE_URI over DJANGO_DB_* when it is set, so handing it to Django
# would create a second, silently-winning source for the database settings.
apiVersion: v1
kind: Secret
metadata:
    name: wger-powersync
    namespace: wger
