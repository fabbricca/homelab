# wger's media: exercise images synced from wger.de, ingredient images
# fetched on demand, and — the only part that exists nowhere else — the
# progress photos users upload to their gallery.
#
# On the SSD over iSCSI rather than NFS on the HDD. The web UI and the app
# fan out into many small image reads, which is the case flash is for, and
# the volume is small enough that the thick LUN costs little.
#
# The *retain* class, as for the Immich library, because the gallery is
# primary data: deleting this claim — or a Flux prune after the directory is
# moved — must leave the LUN behind. Recovering it is the usual
# clear-spec.claimRef-and-rebind.
#
# Size: 10Gi. Exercise images are a few hundred MB, ingredient images arrive
# only as ingredients are viewed, and exercise videos are not synced (see
# SYNC_EXERCISE_VIDEOS_CELERY in config.yaml). The class allows expansion, so
# growing it later is an edit to the number below.
#
# RWO, which is why the celery worker lives in the wger-web pod rather than a
# Deployment of its own: both write here, and two pods on two nodes cannot
# attach the same iSCSI LUN. See web.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wger-media
  namespace: wger
  labels:
    app.kubernetes.io/name: wger
    app.kubernetes.io/component: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: synology-csi-ssd-retain
  resources:
    requests:
      storage: 10Gi
