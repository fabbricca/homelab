# Valkey: Django's cache (db 1) and the Celery broker and result backend
# (db 2), as the single upstream `cache` service provides both.
#
# Namespace-local rather than shared, on the same reasoning as immich: it
# costs ~50 MiB and keeps the whole application one namespace to delete.
#
# Deliberately ephemeral. Upstream's compose file has the redis-data volume
# commented out, and nothing here is a source of truth: sessions are
# cached_db (backed by Postgres), the exercise API cache is rebuilt on demand,
# and a lost queue only drops pending Celery work — a periodic sync that runs
# again next week, or a queued email on an instance that does not send any.
# The one visible effect of a restart is that django-axes forgets failed-login
# counters, which is harmless.
#
# Same Valkey build as immich's (taken from Immich's v3.1.0 compose file),
# so the nodes already have the layers. Upstream wger uses Redis; django-redis
# and Celery only speak the Redis protocol, which Valkey implements unchanged.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: wger
  labels:
    app.kubernetes.io/name: wger
    app.kubernetes.io/component: redis
spec:
  selector:
    app.kubernetes.io/name: wger
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: wger
  annotations:
    checkov.io/skip1: "CKV_K8S_8"
    checkov.io/skip2: "CKV_K8S_9"
  labels:
    app.kubernetes.io/name: wger
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wger
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wger
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
          imagePullPolicy: IfNotPresent
          # Persistence off, matching the emptyDir below. The maxmemory cap
          # is upstream's own advice ("you probably want to limit the memory
          # usage of the cache"). volatile-lru rather than allkeys-lru: it only
          # ever evicts keys that carry a TTL, which is every Django cache
          # entry and none of Celery's queue keys, so a full cache sheds old
          # exercise responses instead of queued tasks — and instead of being
          # OOM-killed against the container limit.
          args:
            - valkey-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 192mb
            - --maxmemory-policy
            - volatile-lru
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { memory: "48Mi", cpu: "20m" }
            limits:   { memory: "256Mi", cpu: "250m" }
          readinessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          emptyDir: {}
