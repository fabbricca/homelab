# Celery beat: the scheduler that enqueues wger's periodic jobs — the weekly
# exercise, exercise-image and API-cache syncs and the monthly ingredient
# sync — for the worker in wger-web to run.
#
# Its own Deployment rather than a fourth container in wger-web, unlike the
# worker: beat touches no volume, so nothing forces it onto the media
# volume's node, and keeping it apart means a web rollout does not reshuffle
# the schedule. Each job's time is drawn at random when beat starts (upstream
# does this to spread load on wger.de), so every restart of this pod moves
# them — harmless, but the reason not to restart it with every web change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wger-beat
  namespace: wger
  labels:
    app.kubernetes.io/name: wger
    app.kubernetes.io/component: beat
spec:
  replicas: 1
  # Two beats mean every periodic task fires twice. Recreate is the cheap way
  # to guarantee there is never a moment with both.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wger
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wger
        app.kubernetes.io/component: beat
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: beat
          image: docker.io/wger/server@sha256:1c5789b93bfe5eed0b7287255782d9177027b255de2b22b59f511a693a48db04  # 2.7
          imagePullPolicy: IfNotPresent
          # Upstream's start script: `celery --app wger beat --schedule
          # /home/wger/beat/celerybeat-schedule`. Its `rm -f celerybeat.pid`
          # is a no-op against the read-only root, which is fine — there is
          # never a stale pid file in a fresh container.
          command: ["/start-beat"]
          envFrom:
            - configMapRef: { name: wger-config }
            - secretRef:    { name: wger-app }
            - secretRef:    { name: wger-database }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            # The schedule file. An emptyDir where upstream has a named
            # volume: it is last-run bookkeeping, and losing it on restart
            # only means beat re-reads the schedule from code — which it
            # re-randomises on every start anyway.
            - name: beat
              mountPath: /home/wger/beat
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { memory: "128Mi", cpu: "10m" }
            limits:   { memory: "384Mi", cpu: "250m" }
      volumes:
        - name: beat
          emptyDir: {}
        - name: tmp
          emptyDir: {}
