# Nightly backup of the part of wger's media that cannot be re-downloaded.
#
# The database needs nothing here. wger's data lives in the shared instance,
# and cluster/postgres/backup-cronjob.yaml runs pg_dumpall — every database,
# plus roles and grants — onto the HDD at 03:15. That covers wger the same way
# it covers Keycloak.
#
# The media volume is a different matter, and mostly not worth backing up:
# exercise images and videos come from wger.de and ingredient images are
# fetched on demand, so all three are re-downloadable (upstream's backup docs
# say as much). What is not is gallery/ — users' progress photos — and gym/,
# where member documents would go. Those are this archive.
#
# Not immich's restic-to-SATA setup. That repository sits on a `local` PV
# that immich-backup already claims, and a second consumer would mean a
# second Talos user volume. For a few MB of photos a tarball on the HDD is
# the proportionate answer — it follows the shared Postgres dumps instead:
# same NAS disk, same retention, same partial-then-rename pattern. The SSD
# holds the originals, the HDD the copies, so losing either disk loses one
# of the two.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: wger-media-backups
  labels:
    app.kubernetes.io/name: wger
    app.kubernetes.io/component: backup
spec:
  capacity:
    # Advisory only; NFS enforces no quota.
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - hard
    - nfsvers=4.1
  csi:
    driver: nfs.csi.k8s.io
    # Must be unique across the cluster; not a real path.
    volumeHandle: wger-media-backups-10.0.0.15
    volumeAttributes:
      server: "10.0.0.15"
      # Create this on the NAS before the first run:
      #   File Station > HDD > New Folder > "wger-media-backups"
      share: "/volume2/HDD/wger-media-backups"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wger-media-backups
  namespace: wger
  labels:
    app.kubernetes.io/name: wger
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  # Empty class plus volumeName binds this to the PV above instead of letting
  # the default class provision an iSCSI LUN — which would put the copy back
  # on the same SSD as the original.
  storageClassName: ""
  volumeName: wger-media-backups
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wger-media-backup
  namespace: wger
  labels:
    app.kubernetes.io/name: wger
    app.kubernetes.io/component: backup
spec:
  # 04:15 local: after both Postgres dumps (03:15, 03:45) and before immich's
  # restic run (04:30), so nothing in the nightly chain shares the NAS.
  schedule: "15 4 * * *"
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      # Mostly a guard for the affinity below: if wger-web is not running,
      # this pod has nowhere to go and would otherwise sit Pending until the
      # next night's run is skipped for it.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wger
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          # wger-media is RWO iSCSI. A second pod can mount it only on the
          # node it is already attached to, which is wherever wger-web is. So
          # instead of pinning both to a node, as immich does, this follows
          # the web pod around: required affinity on its labels, per node.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: wger
                      app.kubernetes.io/component: web
                  topologyKey: kubernetes.io/hostname
          # Writes as uid 999, the uid both Postgres dump jobs already write
          # to this NAS as, so the share's NFS permissions are known to work.
          # Reads the media through fsGroup 1000 — wger's group — on top of
          # Django's world-readable 0644.
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: tar
              # The application image, because it already has tar, gzip and
              # find and is already on the node — no extra image to pin.
              image: docker.io/wger/server@sha256:1c5789b93bfe5eed0b7287255782d9177027b255de2b22b59f511a693a48db04  # 2.7
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
              env:
                - name: RETENTION_DAYS
                  value: "14"
              command: ["/bin/bash", "-ec"]
              args:
                - |
                  STAMP=$(date -u +%Y%m%dT%H%M%SZ)
                  OUT="/backups/wger-media-${STAMP}.tar.gz"

                  # Only the directories that exist; a fresh instance has
                  # neither until someone uploads something.
                  DIRS=""
                  for d in gallery gym; do
                    [ -d "/media/$d" ] && DIRS="$DIRS $d"
                  done
                  if [ -z "$DIRS" ]; then
                    echo "nothing user-uploaded in /media yet; skipping"
                    exit 0
                  fi

                  # Write to a temp name first, then rename. An archive
                  # interrupted halfway would otherwise look like a backup.
                  tar -C /media -czf "${OUT}.partial" $DIRS
                  mv "${OUT}.partial" "${OUT}"
                  echo "wrote ${OUT} ($(stat -c%s "${OUT}") bytes):$DIRS"

                  # Integrity check now rather than during a restore.
                  gzip -t "${OUT}" && echo "gzip integrity OK"

                  find /backups -name 'wger-media-*.tar.gz' -type f \
                    -mtime "+${RETENTION_DAYS}" -print -delete
                  echo "retained: $(ls -1 /backups/wger-media-*.tar.gz 2>/dev/null | wc -l) archive(s)"
              volumeMounts:
                # Read-only: wger-web has the same volume mounted read-write
                # on this node at the same moment.
                - name: media
                  mountPath: /media
                  readOnly: true
                - name: backups
                  mountPath: /backups
              resources:
                requests: { memory: "64Mi", cpu: "50m" }
                limits:   { memory: "256Mi", cpu: "500m" }
          volumes:
            - name: media
              persistentVolumeClaim:
                claimName: wger-media
                readOnly: true
            - name: backups
              persistentVolumeClaim:
                claimName: wger-media-backups
