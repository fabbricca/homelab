# Replaces ingress.yaml.
#
# The per-service certificate (keycloak-tls, issued via the cert-manager
# cluster-issuer annotation) is no longer needed — the Gateway terminates TLS
# once with the shared wildcard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  parentRefs:
    - name: main
      namespace: gateway
  hostnames:
    - keycloak.iberu.me
  rules:
    - backendRefs:
        - name: keycloak
          port: 8080
      timeouts:
        # Mirrors the previous proxy-read-timeout / proxy-send-timeout of 300s.
        request: 300s
        backendRequest: 300s
