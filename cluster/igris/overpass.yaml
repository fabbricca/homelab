# OpenStreetMap for the map generator (Project Igris ADR-042, game repo #51): our own Overpass
# API with Italy only (Geofabrik's extract, then Geofabrik's daily changes). Cluster-internal: no
# HTTPRoute; the generator reads it at http://igris-overpass/api/interpreter and falls back to
# the public Overpass servers while this one is importing or down.
#
# First start: downloads italy-latest.osm.pbf (~2.2 GB), converts it to .osm.bz2 (one thread, the
# longest step) and imports it, then serves: 2 h 35 min on the dev PC (Ryzen 7 5800H), expect ~4 h
# here. The database is ~12 GB and grows slowly with the daily changes. State on igris-overpass:
# rebuildable (delete the PVC to re-import from scratch).
apiVersion: v1
kind: Service
metadata:
  name: igris-overpass
  namespace: igris
  labels:
    app.kubernetes.io/name: igris-overpass
spec:
  selector:
    app.kubernetes.io/name: igris-overpass
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: igris-overpass
  namespace: igris
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: synology-csi-ssd
  resources:
    requests:
      storage: 25Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: igris-overpass
  namespace: igris
  labels:
    app.kubernetes.io/name: igris-overpass
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: igris-overpass
  template:
    metadata:
      labels:
        app.kubernetes.io/name: igris-overpass
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image's supervisord starts as root and runs nginx, fcgiwrap, the dispatcher and the
      # updater as their own users, so no runAsNonRoot here (the namespace's baseline policy
      # allows it); nothing is privileged and no host paths are mounted.
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: overpass
          # Pinned by digest; upgrades are manual (wiktorn/overpass-api is not ours).
          image: wiktorn/overpass-api:v0.7.62.11@sha256:5f643f2aa500333f19458fe8be14457215d6e0b9f891ca5c5ed452b1f8882c47
          imagePullPolicy: IfNotPresent
          env:
            - {name: TZ, value: Europe/Rome}
            - {name: OVERPASS_MODE, value: init}
            - {name: OVERPASS_META, value: "no"}
            - {name: OVERPASS_USE_AREAS, value: "false"}
            - {name: OVERPASS_STOP_AFTER_INIT, value: "false"}
            - {name: OVERPASS_COMPRESSION, value: gz}
            - {name: OVERPASS_FLUSH_SIZE, value: "8"}
            - {name: OVERPASS_UPDATE_SLEEP, value: "3600"}
            - {name: OVERPASS_PLANET_URL, value: "https://download.geofabrik.de/europe/italy-latest.osm.pbf"}
            - {name: OVERPASS_DIFF_URL, value: "https://download.geofabrik.de/europe/italy-updates/"}
            # Geofabrik ships PBF; Overpass's importer reads .osm.bz2.
            - name: OVERPASS_PLANET_PREPROCESS
              value: "mv /db/planet.osm.bz2 /db/planet.osm.pbf && osmium cat -o /db/planet.osm.bz2 /db/planet.osm.pbf && rm /db/planet.osm.pbf"
          ports:
            - {name: http, containerPort: 80, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            # supervisord switches users and nginx binds :80; serving and the updater were tested
            # on the dev PC with exactly these.
            capabilities:
              drop: ["ALL"]
              add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, NET_BIND_SERVICE, KILL]
          # The import ran inside a 3 GiB limit on the dev PC, mostly page cache; serving, the
          # processes themselves hold ~30 MB and the rest is cache.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 3Gi
          # Not ready while importing (nothing listens yet); the generator falls back meanwhile.
          readinessProbe:
            httpGet: {path: /api/status, port: http}
            periodSeconds: 30
          volumeMounts:
            - name: db
              mountPath: /db
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: igris-overpass
