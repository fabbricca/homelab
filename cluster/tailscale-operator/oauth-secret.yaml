# OAuth client for the Tailscale Kubernetes operator.
#
# Create at Tailscale admin console > Settings > OAuth clients, with WRITE
# scope for: Devices (core), Services, and Auth Keys. The operator uses it to
# register itself and to mint auth keys for each proxy it creates.
#
# Set the real values with:
#     sops cluster/tailscale-operator/oauth-secret.yaml
#
# The chart can render this secret from values, but that would put the client
# secret in plaintext in Git — hence oauth.clientId is left empty in the
# HelmRelease so the chart skips it and consumes this one by name instead.
apiVersion: v1
kind: Secret
metadata:
    name: operator-oauth
    namespace: tailscale
type: Opaque
stringData:
    client_id: ENC[AES256_GCM,data:0MVxu3hVIsSqCea+ig6mFN8=,iv:KUDvUg6x+oD9GHBG4p+9zd6RgLahnyUe/c5LfvvzsvI=,tag:LnqNNGgEZj7uJEvyjtrYog==,type:str]
