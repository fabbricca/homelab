apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: synology-csi
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: synology-csi
      version: "0.11.3" # driver v1.3.1
      sourceRef:
        kind: HelmRepository
        name: synology-csi
        namespace: flux-system
      interval: 48h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    clientInfoSecret:
      # Supplied by client-info-secret.yaml (SOPS) rather than rendered from
      # values, so the DSM password never sits in plaintext in Git.
      create: false
      name: synology-csi-client-info

    node:
      plugin:
        # Talos keeps the iscsi-tools binaries outside the default PATH the
        # driver searches. Without this the driver reports "open-iscsi tools not
        # found on host" and every attach fails. The chart documents this exact
        # flag for Talos.
        extraArgs:
          - --iscsiadm-path=/usr/local/sbin/iscsiadm

    storageClasses:
      # Databases and object storage: block volumes on the SSD (/volume1).
      # Named "ssd" so the resulting class reads synology-csi-ssd.
      ssd:
        isDefault: true
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        parameters:
          protocol: iscsi
          # /volume1 is the SSD; /volume2 is the HDD, which csi-driver-nfs
          # already serves for bulk media over NFS.
          location: /volume1
          fsType: ext4

      # Same volume and protocol as `ssd`, but the LUN outlives its PVC.
      #
      # `synology-csi-ssd` reclaims with Delete, which is correct for anything
      # that can be rebuilt — a Postgres that gets restored from a dump, a
      # Prometheus TSDB, a MinIO bucket of derived artefacts. It is the wrong
      # policy for the Immich library, which is the *primary* copy of family
      # photos: there, `kubectl delete pvc` or a mistaken Flux prune would take
      # the originals with it.
      #
      # Retain leaves the PV Released and the LUN intact, so recovering is a
      # matter of clearing spec.claimRef and rebinding. The cost is that a
      # genuinely unwanted volume has to be deleted by hand in DSM.
      ssd-retain:
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        parameters:
          protocol: iscsi
          location: /volume1
          fsType: ext4
          # Passed straight through to mkfs.ext4 by the node plugin.
          #
          # Without it, the first mount of the 250 GiB Immich library LUN took
          # fourteen minutes and failed six times on the way. mke2fs discards
          # the whole device before writing, and 250 GiB of BLKDISCARD over
          # iSCSI to a Celeron-class NAS is far slower than the CSI gRPC
          # deadline. Each timeout left the previous mke2fs still holding the
          # device, so every retry died on:
          #
          #   ...lun-1 is apparently in use by the system;
          #   will not make a filesystem here!
          #
          # which reads like a locking bug and is really just a format that has
          # not finished yet. nodiscard skips the pass entirely; the lazy inits
          # move inode-table and journal zeroing into the background, where the
          # kernel does them while the volume is already usable.
          #
          # Only on this class. The default `ssd` class provisions volumes an
          # order of magnitude smaller, all of which format in seconds, and its
          # parameters are immutable — changing them means deleting a class
          # that eight bound volumes reference, for no gain.
          formatOptions: -E nodiscard,lazy_itable_init=1,lazy_journal_init=1

      # The chart ships six classes by default and Helm merges maps, so each
      # unwanted one has to be disabled explicitly or it gets created.
      iscsi-delete: { disabled: true }
      iscsi-retain: { disabled: true }
      nfs-delete: { disabled: true }
      nfs-retain: { disabled: true }
      smb-delete: { disabled: true }
      smb-retain: { disabled: true }

    # The snapshotter StatefulSet and VolumeSnapshotClass are both gated on the
    # snapshot.storage.k8s.io CRDs, which are not installed. Flux renders against
    # the live cluster, so they are skipped rather than deployed broken.
