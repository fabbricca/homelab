#
# Flux only decrypts files that carry SOPS metadata; a plaintext Secret is
# applied exactly as written, so committing this unencrypted would publish the
# passwords to GitHub *and* deploy them.
#
# Credentials for wger's own database. The same values exist in
# cluster/wger/secret.yaml — wger and PowerSync read them from their own
# namespace, the provisioning Job reads them from this one. Keep the two in
# step: the Job re-syncs both passwords on every run, so a change here that is
# not mirrored there locks the application out.
#
# Two roles, not one, because that is how PowerSync is designed to run:
#   * WGER_DB_USER owns the database, runs Django's migrations, owns the
#     `powersync` publication those migrations create, and is the role
#     PowerSync replicates *as* — so it also gets the REPLICATION attribute.
#   * WGER_PS_STORAGE_USER owns nothing but the `powersync` schema, where the
#     service keeps its bucket storage. PowerSync refuses to use the
#     replication source role for its own storage.
#
# Both passwords go into PS_DATABASE_URI / PS_STORAGE_PG_URI connection
# strings on the wger side, so keep them alphanumeric — anything that needs
# percent-encoding in a URL will be misparsed. Generate with e.g.:
#   openssl rand -hex 24
