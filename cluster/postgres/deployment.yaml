apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          # pgvector/pgvector is plain Postgres plus the vector extension, so it
          # serves ordinary databases and anything needing embeddings from the
          # same instance. Kept for the latter (e.g. Immich).
          image: pgvector/pgvector:pg17
          imagePullPolicy: IfNotPresent
          # wal_level=logical is for wger's PowerSync service, which streams
          # changes out of the wger database through a logical replication
          # slot (cluster/wger/powersync.yaml). It only writes a little more
          # WAL than the default `replica`, and it is per-instance: there is
          # no way to enable it for one database. Changing it needs a restart,
          # which this Deployment's Recreate strategy does on rollout —
          # Keycloak is unavailable for those few seconds.
          #
          # max_slot_wal_keep_size is the guard that comes with it. A
          # replication slot pins WAL until its consumer confirms it, so a
          # PowerSync that is down — or scaled to zero and forgotten — would
          # otherwise grow pg_wal until it fills this 20 GiB volume and takes
          # Keycloak down with it. Capped, Postgres invalidates the slot
          # instead; PowerSync notices and re-snapshots from scratch, and the
          # phones silently re-sync. Losing a cache is the right trade.
          args:
            - postgres
            - -c
            - wal_level=logical
            - -c
            - max_slot_wal_keep_size=2GB
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
