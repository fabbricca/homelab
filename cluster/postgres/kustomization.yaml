apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: postgres
# Shared PostgreSQL (pgvector) instance.
# Tenant isolation is done at the database + user level: each platform gets its
# own database and role. The pgvector extension is available to any of them.
#
# Provisioning is done with a Job + Secret pair rather than initdb scripts,
# because initdb only runs against an empty data directory — useless once the
# instance is live. The Jobs are idempotent, so Flux can reapply them freely.
resources:
  - pvc.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  # Per-platform database provisioning:
  - keycloak-db-secret.yaml
  - keycloak-provision-job.yaml
commonLabels:
  app.kubernetes.io/managed-by: flux
