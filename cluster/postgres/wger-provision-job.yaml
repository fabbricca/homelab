# Creates wger's roles, database and PowerSync storage schema.
#
# Cloned from keycloak-provision-job.yaml, with two additions PowerSync needs.
#
# REPLICATION on the wger role. PowerSync streams changes out of the wger
# database over a logical replication slot, and Postgres only lets a role open
# a replication connection if it carries this attribute. What it does *not*
# give the role is a copy of the other databases in this instance: physical
# replication (the whole-cluster WAL stream) is gated separately by pg_hba,
# and this instance's pg_hba only allows `replication` connections from
# localhost. A logical slot is per-database and only publishes the tables in
# the publication the wger migrations create, so the role sees nothing it does
# not already own.
#
# The powersync_storage role and schema. This is what upstream's
# `manage.py setup-powersync-storage` does, done here instead because it needs
# CREATE ROLE, which the application role deliberately does not have. Same SQL,
# same names, same database — upstream's docker setup keeps bucket storage in a
# `powersync` schema inside the wger database, and that is the configuration
# they test.
#
# Idempotent: re-running is harmless, so Flux can reapply it freely.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-provision-wger
  namespace: postgres
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: provisioning
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: psql
          image: pgvector/pgvector:pg17
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PGHOST
              value: postgres.postgres.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: POSTGRES_USER }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD }
            - name: PGDATABASE
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: POSTGRES_DB }
            - name: WGER_DB_NAME
              valueFrom:
                secretKeyRef: { name: wger-db, key: WGER_DB_NAME }
            - name: WGER_DB_USER
              valueFrom:
                secretKeyRef: { name: wger-db, key: WGER_DB_USER }
            - name: WGER_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: wger-db, key: WGER_DB_PASSWORD }
            - name: PS_STORAGE_USER
              valueFrom:
                secretKeyRef: { name: wger-db, key: WGER_PS_STORAGE_USER }
            - name: PS_STORAGE_PASSWORD
              valueFrom:
                secretKeyRef: { name: wger-db, key: WGER_PS_STORAGE_PASSWORD }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready -q; do echo "waiting for postgres"; sleep 3; done

              # PowerSync cannot replicate without logical decoding. wal_level
              # is set in deployment.yaml and only takes effect on a restart,
              # so a Job that ran against the old pod must fail loudly here
              # rather than leave a database PowerSync will crash-loop against.
              WAL_LEVEL=$(psql -tAc "SHOW wal_level")
              if [ "$WAL_LEVEL" != "logical" ]; then
                echo "wal_level is '$WAL_LEVEL', expected 'logical' — has the postgres pod restarted?"
                exit 1
              fi

              # Roles and databases have no IF NOT EXISTS, so check first.
              if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='$WGER_DB_USER'" | grep -q 1; then
                psql -c "CREATE ROLE \"$WGER_DB_USER\" LOGIN REPLICATION PASSWORD '$WGER_DB_PASSWORD'"
                echo "role $WGER_DB_USER created"
              else
                psql -c "ALTER ROLE \"$WGER_DB_USER\" LOGIN REPLICATION PASSWORD '$WGER_DB_PASSWORD'"
                echo "role $WGER_DB_USER already existed; password synced"
              fi

              if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='$PS_STORAGE_USER'" | grep -q 1; then
                psql -c "CREATE ROLE \"$PS_STORAGE_USER\" LOGIN PASSWORD '$PS_STORAGE_PASSWORD'"
                echo "role $PS_STORAGE_USER created"
              else
                psql -c "ALTER ROLE \"$PS_STORAGE_USER\" LOGIN PASSWORD '$PS_STORAGE_PASSWORD'"
                echo "role $PS_STORAGE_USER already existed; password synced"
              fi

              if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname='$WGER_DB_NAME'" | grep -q 1; then
                psql -c "CREATE DATABASE \"$WGER_DB_NAME\" OWNER \"$WGER_DB_USER\""
                echo "database $WGER_DB_NAME created"
              else
                echo "database $WGER_DB_NAME already existed"
              fi

              # Django creates its own schema on first start, so it needs
              # ownership of the public schema, not just connect rights.
              psql -d "$WGER_DB_NAME" -c "ALTER SCHEMA public OWNER TO \"$WGER_DB_USER\""

              # PowerSync's bucket storage. Mirrors setup-powersync-storage.
              psql -d "$WGER_DB_NAME" -c "CREATE SCHEMA IF NOT EXISTS powersync AUTHORIZATION \"$PS_STORAGE_USER\""
              psql -d "$WGER_DB_NAME" -c "GRANT CONNECT ON DATABASE \"$WGER_DB_NAME\" TO \"$PS_STORAGE_USER\""
              echo "provisioning complete"
