# Creates Loom's role and database.
#
# A Job rather than an initdb script because initdb only runs against an empty
# data directory — once Postgres has started, adding a database means doing it
# over SQL. Same pattern the MinIO tenant provisioning used.
#
# Idempotent: re-running is harmless, so Flux can reapply it freely.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-provision-loom
  namespace: postgres
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: provisioning
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: psql
          image: pgvector/pgvector:pg17
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PGHOST
              value: postgres.postgres.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: POSTGRES_USER }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD }
            - name: PGDATABASE
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: POSTGRES_DB }
            - name: LM_DB_NAME
              valueFrom:
                secretKeyRef: { name: loom-db, key: LOOM_DB_NAME }
            - name: LM_DB_USER
              valueFrom:
                secretKeyRef: { name: loom-db, key: LOOM_DB_USER }
            - name: LM_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: loom-db, key: LOOM_DB_PASSWORD }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready -q; do echo "waiting for postgres"; sleep 3; done

              # Roles and databases have no IF NOT EXISTS, so check first.
              if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='$LM_DB_USER'" | grep -q 1; then
                psql -c "CREATE ROLE \"$LM_DB_USER\" LOGIN PASSWORD '$LM_DB_PASSWORD'"
                echo "role $LM_DB_USER created"
              else
                psql -c "ALTER ROLE \"$LM_DB_USER\" LOGIN PASSWORD '$LM_DB_PASSWORD'"
                echo "role $LM_DB_USER already existed; password synced"
              fi

              if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname='$LM_DB_NAME'" | grep -q 1; then
                psql -c "CREATE DATABASE \"$LM_DB_NAME\" OWNER \"$LM_DB_USER\""
                echo "database $LM_DB_NAME created"
              else
                echo "database $LM_DB_NAME already existed"
              fi

              # Loom creates its own tables on first start, so it needs
              # ownership of the public schema, not just connect rights.
              psql -d "$LM_DB_NAME" -c "ALTER SCHEMA public OWNER TO \"$LM_DB_USER\""
              echo "provisioning complete"
