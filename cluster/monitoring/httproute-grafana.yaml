# Reachable over Tailscale at 10.0.0.150 with this Host header, or from the
# LAN. Deliberately NOT registered as a Pangolin resource — admin surfaces stay
# private, and Jellyfin remains the only publicly exposed service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: main
      namespace: gateway
  hostnames:
    - grafana.iberu.me
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
