# Reachable at headlamp.iberu.me over Tailscale or the LAN. Not published
# through the Pangolin tunnel — see the HelmRelease for why.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
spec:
  parentRefs:
    - name: main
      namespace: gateway
  hostnames:
    - headlamp.iberu.me
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
