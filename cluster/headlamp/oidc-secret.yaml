# OIDC credentials for Headlamp.
#
# Supplied as a SOPS secret rather than through chart values, which would put
# the client secret in plaintext in Git.
#
# NOTE the key names. With config.oidc.externalSecret.enabled the chart mounts
# this secret with envFrom, so each KEY becomes an environment variable name
# verbatim. They must be the variables Headlamp reads (OIDC_*), not the
# camelCase names the chart uses when it creates the secret itself.
#
# OIDC_CALLBACK_URL is pinned rather than derived from the request. Behind the
# Tailscale proxy the derived value can differ between the authorization
# request and the token exchange, and Keycloak rejects the code when the two
# redirect_uri values are not byte-identical ("invalid_grant: Code not valid").
# Pinning it also means this URL must be registered on the Keycloak client.
apiVersion: v1
kind: Secret
metadata:
    name: oidc
    namespace: headlamp
type: Opaque
stringData:
