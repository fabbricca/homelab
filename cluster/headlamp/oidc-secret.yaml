# OIDC credentials for Headlamp.
#
# Supplied as a SOPS secret rather than through chart values, which would put
# the client secret in plaintext in Git.
#
# NOTE the key names. With config.oidc.externalSecret.enabled the chart mounts
# this secret with envFrom, so each KEY becomes an environment variable name
# verbatim. They must be the variables Headlamp reads (OIDC_*), not the
# camelCase names the chart uses when it creates the secret itself.
#
# OIDC_SCOPES deliberately omits "openid": Headlamp prepends it, and sending it
# again produced "Invalid scopes: openid openid profile email groups".
# "groups" is omitted too — it is not a client scope in this realm. The groups
# claim comes from the protocol mapper on the "kubernetes" client, so it is
# present in the token regardless of scopes.
#
# OIDC_CALLBACK_URL is pinned rather than derived from the request. Behind the
# Tailscale proxy the derived value can differ between the authorization
# request and the token exchange, and Keycloak rejects the code unless the two
# redirect_uri values are byte-identical.
apiVersion: v1
kind: Secret
metadata:
    name: oidc
    namespace: headlamp
type: Opaque
stringData:
    OIDC_CLIENT_ID: ENC[AES256_GCM,data:FkhkNovMg8pLNA==,iv:IiV9FlHtnX7ptUVwc+uRuvNTrw71B+bF3re7fbTuDtc=,tag:r4yUFK3w0ZVT5YarhmJjVg==,type:str]
