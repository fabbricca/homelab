# Next.js UI and BFF proxy — the only component the Gateway routes to, matching
# the compose file where `web` is the only service that publishes a port.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: poseidon
spec:
  selector:
    app.kubernetes.io/name: poseidon
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: poseidon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: poseidon
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: poseidon
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: web
          image: fabbricca/poseidon-web@sha256:d4da9082ae96b08b80e4089d8ab3ce5a8852727be1a9ae65a1b617fccb2226f4  # 1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: API_INTERNAL_URL
              value: http://api:8000
            - name: HOSTNAME
              value: "0.0.0.0"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            # Next's standalone server writes its image and fetch caches here.
            - { name: cache, mountPath: /app/.next/cache }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits:   { memory: "512Mi", cpu: "1" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
