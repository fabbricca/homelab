apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: poseidon
# Poseidon — competitor ad intelligence and creative generation.
# Source: ../../../poseidon (built and pushed to docker.io/fabbricca/poseidon-*).
#
# This is the repository's sandbox configuration
# (docker-compose.yml + docker-compose.sandbox.yml), not its production one:
# every vendor API — Meta Ad Library, Shopify, Reddit, Trustpilot, GA4, HubSpot,
# BigQuery — is answered by the `mockapi` service on the internal network. The
# application code is unchanged; only the base URLs in poseidon-config move, so
# the clients, retries, pagination and parsing exercised here are the real ones.
#
# The single exception is Anthropic, which points at the live API. The sandbox's
# LLM gateway parks every model call for a human to answer by hand, which cannot
# work on an unattended public host. See the comment in config.yaml.
#
# Postgres, Redis and MinIO are namespace-local rather than the shared instances
# in cluster/postgres/ and cluster/minio/, so the whole application is one
# namespace to delete. See the note at the top of postgres.yaml for the cost.
# ── STOPPED ────────────────────────────────────────────────────────────────
# Every Deployment here is at `replicas: 0`. Poseidon is not needed at the
# moment; this frees its CPU and memory without giving up anything else.
#
# Scaled to zero in Git rather than with `kubectl scale`, because this
# Kustomization reconciles every 15m: a manual scale would be silently undone
# by the next reconciliation, and the pods would come back on their own.
# Suspending the Kustomization would also have worked, but that parks the
# cluster in a state the repository does not describe — the opposite of what
# `prune: true` and "no drift" are for here.
#
# What is deliberately NOT removed, so bringing it back is one commit:
#   * both PVCs — poseidon-postgres-data (8Gi) and poseidon-minio-data (10Gi).
#     The database and object store survive intact; nothing here deletes data.
#   * the Secrets, ConfigMap, Services and the HTTPRoute. They cost nothing
#     while idle. poseidon.iberu.me answers 503 from Envoy rather than 404,
#     which reads as "down" instead of "never existed".
#
# To bring it back: set these nine `replicas` back to 1 and push. The api
# Deployment's migrate initContainer re-runs Alembic on the existing volume,
# which is a no-op when the schema is already at head.
# ───────────────────────────────────────────────────────────────────────────

resources:
  - secret.yaml
  - config.yaml
  # Datastores first — the application's initContainers block on them anyway,
  # but the ordering makes a cold start read the way it happens.
  - postgres.yaml
  - redis.yaml
  - minio.yaml
  # Mock vendor APIs.
  - mockapi.yaml
  # Application. api carries the migrate initContainer that worker and beat wait on.
  - api.yaml
  - worker.yaml
  - web.yaml
  - console.yaml
  - httproute.yaml
commonLabels:
  app.kubernetes.io/managed-by: flux
