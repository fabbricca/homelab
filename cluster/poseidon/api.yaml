# FastAPI: auth, CRUD, and the entry point that enqueues pipeline runs. Not
# published — the browser only ever talks to `web`, which proxies to this
# service at /api/proxy/* so the session cookie stays same-origin and the API's
# address is never learned by a client.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: poseidon
spec:
  selector:
    app.kubernetes.io/name: poseidon
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: poseidon
spec:
  replicas: 1
  # Migrations run as this pod's initContainer, so two of them must never be
  # alive at once. Recreate makes that structural rather than probabilistic.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: poseidon
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: poseidon
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        # The compose file runs this as a one-shot `migrate` service that the
        # other three wait on. A Job cannot play that role under Flux: a Job's
        # spec is immutable, so every image bump would need the old Job deleted
        # by hand before the new one could be applied. Attaching it to the api
        # Deployment instead means migrations run exactly when the image
        # changes, which is the moment they are actually needed.
        #
        # Waits for Postgres, runs Alembic to head, creates the MinIO buckets.
        - name: migrate
          image: fabbricca/poseidon-backend@sha256:23636fedfb90fc113296ed11124a9c9e447e3e53818643c35c6f8b82fbfe68d5  # 1.0.1
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "poseidon.core.bootstrap"]
          envFrom:
            - configMapRef: { name: poseidon-config }
            - secretRef:     { name: poseidon-app }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits:   { memory: "512Mi", cpu: "1" }
      containers:
        - name: api
          image: fabbricca/poseidon-backend@sha256:23636fedfb90fc113296ed11124a9c9e447e3e53818643c35c6f8b82fbfe68d5  # 1.0.1
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "poseidon.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: poseidon-config }
            - secretRef:     { name: poseidon-app }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { memory: "256Mi", cpu: "50m" }
            limits:   { memory: "768Mi", cpu: "1" }
          # /health is a liveness answer; /ready additionally checks the
          # database connection and that the master key is present, which is
          # what "can this pod serve traffic" actually means here.
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
