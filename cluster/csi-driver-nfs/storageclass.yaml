apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: nfs.csi.k8s.io
parameters:
  # Synology DS218+. /volume2 is the HDD (bay 1); the SSD is /volume1 because
  # its pool was created first. Bulk, sequential, RWX data lives here — media
  # above all. Databases belong on the SSD over iSCSI, not on this class.
  server: "10.0.0.15"
  share:  "/volume2/HDD"
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - hard
  - nfsvers=4.1