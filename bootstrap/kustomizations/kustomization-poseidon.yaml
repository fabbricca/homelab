apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: poseidon
  namespace: flux-system
spec:
  interval: 15m
  path: ./cluster/poseidon
  prune: true
  # Longer than the 5m the other applications use: a cold start runs Alembic
  # against an empty database and pulls four images that are not in any node's
  # cache on first reconciliation.
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: namespace-poseidon
      namespace: flux-system
    - name: gateway
      namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: api
      namespace: poseidon
    - apiVersion: apps/v1
      kind: Deployment
      name: web
      namespace: poseidon
