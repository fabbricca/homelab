apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wger
  namespace: flux-system
spec:
  interval: 15m
  path: ./cluster/wger
  prune: true
  # Longer than the 5m most applications use. A cold start pulls a ~1 GB
  # wger image that is in no node's cache, then runs the whole migration chain
  # against an empty database, loads the fixtures and collects ~11k static
  # files before gunicorn binds its port. PowerSync cannot become ready until
  # those migrations have created the publication it replicates from.
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: namespace-wger
      namespace: flux-system
    - name: gateway
      namespace: flux-system
    # wger keeps its data in the shared instance, so the role and database —
    # and wal_level=logical, which PowerSync needs — have to land first. Same
    # reasoning as keycloak.
    - name: postgres
      namespace: flux-system
    # The media volume asks for synology-csi-ssd-retain, created by this
    # Kustomization's HelmRelease. Same reasoning as immich.
    - name: synology-csi
      namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: wger-web
      namespace: wger
    - apiVersion: apps/v1
      kind: Deployment
      name: powersync
      namespace: wger
