apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: synology-csi
  namespace: flux-system
spec:
  interval: 12h
  # Community chart around SynologyOpenSource/synology-csi. Synology publish the
  # driver but no chart repository, so this is the maintained packaging of it.
  url: https://christian-schlichtherle.github.io/synology-csi-chart
