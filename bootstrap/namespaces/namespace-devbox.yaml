# The Claude Code remote-control box.
#
# Enforces `privileged`, which is the one honest option for a namespace that
# runs virtual machines. virt-launcher needs to open /dev/kvm, manage tap
# devices and call mount(2) on the guest's disks; `baseline` rejects it
# outright. This is the same level the kubevirt and cdi namespaces already
# run at, and the reason nothing else is allowed to share this namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: devbox
  labels:
    app.kubernetes.io/name: devbox
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
