apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    app.kubernetes.io/name: tailscale
    # The proxy pods the operator creates need NET_ADMIN to run the userspace
    # WireGuard tunnel and program routes, which baseline forbids.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
