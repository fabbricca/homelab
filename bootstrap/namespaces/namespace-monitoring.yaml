apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/name: monitoring
    # Talos enforces PodSecurity "baseline" cluster-wide. node-exporter cannot
    # run under it — reading host metrics genuinely requires hostNetwork,
    # hostPID, hostPort 9100 and hostPath mounts of /proc, /sys and /.
    #
    # This is a real widening: it applies to the whole namespace, so anything
    # else deployed here could request host access too. Acceptable while this
    # namespace holds only the monitoring stack, but worth revisiting in the
    # RBAC/PSS phase — node-exporter could live in its own namespace and leave
    # Prometheus and Grafana under "restricted".
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
